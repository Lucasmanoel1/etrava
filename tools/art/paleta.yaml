# Paleta v3 do ETRAVA (SPEC-visual §5.3, STYLE.md v3).
#
# Toda a arte (sprites, tiles, objetos, ícones) usa só estas cores (VT-04). A paleta do M8
# (53 cores) está inteira aqui; a v3 acrescenta rampas: pele mais longa, cabelos, verdes da
# bétula, flores dessaturadas, latão e água turva. Nenhuma cor nova é mais saturada que a
# ferrugem mais viva (C47A48).
#
# Rampa = tons do mais escuro ao mais claro. O pixelizador escolhe o tom pela luz do pixel;
# o mais escuro é reservado ao contorno e às dobras. Uma cor pode estar em várias rampas.
# `soltas` são cores da paleta que não estão em rampa nenhuma (sombra, sangue).


# Celi, viúva nova, dona do pomar (camada B). Retrato: capuz vermelho-ferrugem, trança castanha,
# vestido de linho com corpete.
tipo: personagem
id: aldea
manifesto: {id: personagem.aldea, papel: comum}
ficha:
  idade: 26
  oficio: pomareira
  traco: capa longa e capuz vermelhos sempre postos (luto que ela não chama de luto)
  postura: ereta, passo miúdo, braços junto do corpo
  trabalho: trabalhar_chao   # colhe e cata do chão

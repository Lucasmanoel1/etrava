  - {peca: corpete, rampa: tecido_marrom}
  - {peca: saia, rampa: tecido_marrom, comprimento: longa}
  - {peca: botas, rampa: couro, altura: 0.10}
  - {peca: cabelo, rampa: cabelo_castanho, estilo: tranca}
  - {peca: capa, rampa: ferrugem, comprimento: longa}
  - {peca: capuz, rampa: ferrugem}
ferramenta: {mao_e: cesto}

# O jogador: aprendiz de ferramenteiro, uns 17 anos (retrato: arte-bruta/retratos/aprendiz.png).
# Camisa de linho clara (o item inicial dele, D-090), calça de lã escura, botas, cinto e bolsa.
tipo: personagem
id: aprendiz
manifesto:
  - {id: personagem.aprendiz, papel: jogador, folhas: [aprendiz]}
  # camadas de cabeça (SPEC-visual §6.4): o corpo entra como holdout; o jogo desenha por cima
  - {id: personagem.aprendiz_chapeu, papel: camada, folhas: [aprendiz_chapeu]}
  - {id: personagem.aprendiz_capuz, papel: camada, folhas: [aprendiz_capuz]}
pixelorama: true
quadro: [64, 80]
ancora: [32, 72]
direcoes: 8
animacoes:
  - {nome: parado, quadros: 8, fps: 5}
  - {nome: andar, quadros: 8, fps: 10, passada: 1.15}
  - {nome: correr, quadros: 8, fps: 12.5, passada: 1.9}
  # V2 (SPEC-visual §6.2, jogador): vida comum; golpes, dano, queda e levantar ficam no V3
  - {nome: sentar, quadros: 3, fps: 6}
  - {nome: sentado, quadros: 4, fps: 3}
  - {nome: trabalhar_bancada, quadros: 8, fps: 7}
  - {nome: trabalhar_martelo, quadros: 8, fps: 8}
  - {nome: trabalhar_chao, quadros: 8, fps: 6}
  - {nome: dormir, quadros: 4, fps: 2}
corpo: {altura: 1.68, corpo: magro, cabeca: 1.25}
cores: {pele: pele_clara}
roupa:
  - {peca: camisa, rampa: linho, manga: arregacada, luz_min: 0.55, barra: 0.20}
  - {peca: calca, rampa: tecido_marrom}
  - {peca: botas, rampa: couro, altura: 0.17}
  - {peca: cabelo, rampa: cabelo_castanho, estilo: baguncado}
  - {peca: cinto, rampa: madeira_escura}
  - {peca: bolsa, rampa: couro}
# o jogador lê mais claro que o chão em toda hora (VT-03, D-090): valores mais altos
pixelizador: {ambiente: 0.42, difusa: 0.62}
# itens de cabeça do jogo (content/items.yaml): chapeu_feltro e capuz_la
camadas:
  - {nome: chapeu, roupa: [{peca: chapeu_aba, rampa: tecido_marrom, aba: media}]}
  - {nome: capuz, roupa: [{peca: capuz, rampa: la_crua}]}

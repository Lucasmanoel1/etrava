# A árvore velha de Nalia (V4, arco A1): peça única, maior e mais antiga que todas. Um esqueleto
# só (mesma semente) em três estados — `morta` (o inicial), `viva` (brotou) e `cortada` (o toco).
# Nada sobrenatural na imagem: a viva é uma árvore velha com folha nova, rala; a morta é galho
# nu; a cortada é toco com corte fresco. O arco revela o resto, a arte não.
tipo: arvore
id: arvore_nalia
especie: carvalho
manifesto:
  - {id: prop.arvore_nalia_morta, folhas: [nalia_morta]}
  - {id: prop.arvore_nalia_viva, folhas: [nalia_viva]}
  - {id: prop.arvore_nalia_cortada, folhas: [nalia_cortada]}
pixelorama: true
quadro: [600, 500]
ancora: [250, 460]
vento: {quadros: 192, fps: 60}
variantes:
  - {nome: nalia_morta, altura: 8.0, copa: 6.8, idade: 2.0, grossura: 1.05, semente: 211, forma: {sinuoso: 0.24},
     seca: true, pontas: 0.9, casca: casca_freixo, vento: {quadros: 1, fps: 1}}
  - {nome: nalia_viva, altura: 8.0, copa: 6.8, idade: 2.0, grossura: 1.05, semente: 211, forma: {sinuoso: 0.24},
     densidade: 0.72, mistura: 0.0}
  - {nome: nalia_cortada, altura: 1.0, copa: 1.0, idade: 2.0, grossura: 1.3, semente: 211, toco: true, fuste: 1.4,
     vento: {quadros: 1, fps: 1}}
pixelizador: {ambiente: 0.34, difusa: 0.78}

# Pisos de interior (V6): cada um vira uma textura de terreno de 512×256 px de arte, repetível e
# alinhada ao mundo (como tools/blender/chao/terrenos.yaml), mas feita de peças (tábua, laje,
# pedrinha). O mapa não muda: a assets/config/interiores.yaml diz, por cômodo, qual piso desenha
# no lugar do terreno do mapa (tabuas → piso_tabua…). O som dos passos continua o do terreno.
tipo: pisos
id: pisos_interior
recortar: false
quadro: [512, 256]
pixelizador: {ambiente: 0.22, difusa: 0.46}
manifesto:
  - {id: tile.piso_tabua, folhas: [piso_tabua], prioridade: 6}
  - {id: tile.piso_tabua_clara, folhas: [piso_tabua_clara], prioridade: 6}
  - {id: tile.piso_lajota, folhas: [piso_lajota], prioridade: 4}
  - {id: tile.piso_pedra, folhas: [piso_pedra], prioridade: 4}
  - {id: tile.piso_terra_batida, folhas: [piso_terra_batida], prioridade: 2}
pisos:
  # assoalho largo e gasto (oficina): tábuas de 25 cm, emendas desencontradas, veio comprido
  - nome: piso_tabua
    forma: tabuas
    semente: 3
    largura: 0.25
    fresta: 0.035
    comprimento: [1.2, 2.67]
    fresta_rampa: madeira_escura
    fresta_tons: [0, 1]
    materiais:
      - {rampa: madeira, ruido: 6.0, ruido_eixos: [0.6, 14.0, 14.0], k: 0.4, tons: [2, 4]}
      - {rampa: madeira, ruido: 8.0, ruido_eixos: [0.5, 18.0, 18.0], k: 0.4, tons: [2, 4]}
      - {rampa: madeira, ruido: 6.0, ruido_eixos: [0.6, 14.0, 14.0], k: 0.4, tons: [1, 4]}
  # tábuas mais estreitas e claras, esfregadas (curandeira)
  - nome: piso_tabua_clara
    forma: tabuas
    semente: 5
    largura: 0.2
    fresta: 0.035
    comprimento: [1.0, 2.0]
    fresta_rampa: madeira_escura
    fresta_tons: [1, 2]
    materiais:
      - {rampa: madeira_clara, ruido: 6.0, ruido_eixos: [0.6, 16.0, 16.0], k: 0.4, tons: [2, 4]}
      - {rampa: madeira_clara, ruido: 8.0, ruido_eixos: [0.5, 20.0, 20.0], k: 0.4, tons: [2, 4]}
      - {rampa: madeira_clara, ruido: 6.0, ruido_eixos: [0.6, 16.0, 16.0], k: 0.4, tons: [1, 4]}
  # lajes de pedra em fiadas (taverna): grandes, gastas no meio, juntas de terra
  - nome: piso_lajota
    forma: lajes
    semente: 7
    fiada: [0.5, 0.75]
    comprimento: [0.5, 0.9]
    fresta: 0.04
    inclinacao: 0.025
    fresta_rampa: terra
    fresta_tons: [0, 1]
    materiais:
      - {rampa: pedra, textura: pedra.png, escala: 0.625, k: 0.45, tons: [2, 4]}
      - {rampa: pedra, textura: pedra.png, escala: 0.75, k: 0.45, tons: [2, 4]}
      - {rampa: pedra, textura: pedra.png, escala: 0.75, k: 0.45, tons: [1, 4]}
  # pedra miúda e irregular (moinho): fiadas baixas, peças partidas, mais desnível
  - nome: piso_pedra
    forma: lajes
    semente: 9
    fiada: [0.3, 0.48]
    comprimento: [0.3, 0.6]
    fresta: 0.04
    inclinacao: 0.07
    partir: 0.3
    fresta_rampa: pedra
    fresta_tons: [0, 1]
    materiais:
      - {rampa: pedra, textura: pedra.png, escala: 1.25, k: 0.5, tons: [1, 4]}
      - {rampa: pedra, textura: pedra.png, escala: 1.5, k: 0.5, tons: [1, 4]}
      - {rampa: casca_seca, textura: pedra.png, escala: 1.375, k: 0.45, tons: [2, 4]}
  # terra batida, com pedrinhas e lascas (kit; nenhum dos quatro cômodos a usa hoje)
  - nome: piso_terra_batida
    forma: terra
    semente: 11
    pedrinhas: 140
    fresta_rampa: terra
    fresta_tons: [0, 1]
    materiais:
      - {rampa: terra, textura: terra.png, escala: 0.5, k: 0.7, tons: [1, 3]}
      - {rampa: pedra, k: 0.2, tons: [2, 4]}
      - {rampa: terra_seca, k: 0.2, tons: [2, 4]}

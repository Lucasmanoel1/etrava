  - {id: prop.parede_canto_curandeira, folhas: [curandeira_canto]}
  - {id: prop.parede_ponta_curandeira, folhas: [curandeira_ponta]}
  - {id: prop.parede_canto_frente_curandeira, folhas: [curandeira_canto_frente]}
pecas:

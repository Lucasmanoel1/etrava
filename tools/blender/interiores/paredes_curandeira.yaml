# Casca do cômodo (V6): A casa da curandeira: baixa, enxaimel com reboco caiado (linho) e madeira mais clara.
# Peças de 1 m (pegada do content/props.yaml); o cliente troca prop.parede_* pela versão da casa
# (assets/config/interiores.yaml) e põe as da frente e as pontas (CascaInterior).
tipo: paredes
id: paredes_curandeira
quadro: [84, 132]
ancora: [42, 110]
corte: 0.4
estilo: enxaimel
altura: 2.45
reboco: linho
tons_reboco: [1, 4]
madeira: madeira
semente: 51
travessa: 0.85
pixelizador: {ambiente: 0.42, difusa: 0.40}
manifesto:
  - {id: prop.parede_x_lisa_curandeira, folhas: [curandeira_x_lisa_a, curandeira_x_lisa_b, curandeira_x_lisa_c]}
  - {id: prop.parede_x_janela_curandeira, folhas: [curandeira_x_janela]}
  - {id: prop.parede_x_porta_curandeira, folhas: [curandeira_x_porta]}
  - {id: prop.parede_x_prateleira_curandeira, folhas: [curandeira_x_prateleira]}
  - {id: prop.parede_frente_x_curandeira, folhas: [curandeira_frente_x_a, curandeira_frente_x_b]}
  - {id: prop.parede_y_lisa_curandeira, folhas: [curandeira_y_lisa_a, curandeira_y_lisa_b, curandeira_y_lisa_c]}
  - {id: prop.parede_y_janela_curandeira, folhas: [curandeira_y_janela]}
  - {id: prop.parede_y_porta_curandeira, folhas: [curandeira_y_porta]}

  - {id: prop.parede_frente_x_oficina, folhas: [oficina_frente_x_a, oficina_frente_x_b]}
  - {id: prop.parede_y_lisa_oficina, folhas: [oficina_y_lisa_a, oficina_y_lisa_b, oficina_y_lisa_c]}
  - {id: prop.parede_y_lisa, folhas: [oficina_y_lisa_a, oficina_y_lisa_b, oficina_y_lisa_c]}   # padrão (substitui a arte provisória)
  - {id: prop.parede_y_janela_oficina, folhas: [oficina_y_janela]}
  - {id: prop.parede_y_janela, folhas: [oficina_y_janela]}   # padrão (substitui a arte provisória)
  - {id: prop.parede_y_porta_oficina, folhas: [oficina_y_porta]}

# Casca do cômodo (V6): A oficina de Avel: enxaimel com reboco claro, esteios escuros; embasamento de pedra na frente (como o exterior do V5).
# Peças de 1 m (pegada do content/props.yaml); o cliente troca prop.parede_* pela versão da casa
# (assets/config/interiores.yaml) e põe as da frente e as pontas (CascaInterior).
tipo: paredes
id: paredes_oficina
quadro: [84, 132]
ancora: [42, 110]
corte: 0.4
estilo: enxaimel
altura: 2.6
reboco: reboco
semente: 13
pixelizador: {ambiente: 0.42, difusa: 0.40}
manifesto:
  - {id: prop.parede_x_lisa_oficina, folhas: [oficina_x_lisa_a, oficina_x_lisa_b, oficina_x_lisa_c]}
  - {id: prop.parede_x_lisa, folhas: [oficina_x_lisa_a, oficina_x_lisa_b, oficina_x_lisa_c]}   # padrão (substitui a arte provisória)
  - {id: prop.parede_x_janela_oficina, folhas: [oficina_x_janela]}
  - {id: prop.parede_x_janela, folhas: [oficina_x_janela]}   # padrão (substitui a arte provisória)
  - {id: prop.parede_x_porta_oficina, folhas: [oficina_x_porta]}
  - {id: prop.parede_x_porta, folhas: [oficina_x_porta]}   # padrão (substitui a arte provisória)
  - {id: prop.parede_x_prateleira_oficina, folhas: [oficina_x_prateleira]}

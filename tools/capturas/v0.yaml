# Capturas de referência do fim do V0 (gradlew captures -Proteiro=v0 -Psaida=docs/capturas/v0).
# É a linha de base "antes" da arte nova: o V1 em diante repete estas cenas para comparar.
# Cada cena: jogo novo na área, comandos de console, espera, captura.
padrao: {semente: 5, tamanho: [1280, 720], quadros: 50}

cenas:
  # mundo
  - {nome: vila_dia, area: vila, cmds: ["tp 30 33", "hora 10", "zoom 2"], medir: true}
  - {nome: vila_entardecer, area: vila, cmds: ["tp 30 33", "hora 18.5", "zoom 2"], medir: true}
  - {nome: vila_noite, area: vila, cmds: ["tp 30 33", "hora 21", "zoom 2"], medir: true}
  - {nome: vila_perto, area: vila, cmds: ["tp 30 33", "hora 10", "zoom 4"], medir: true}
  - {nome: posto, area: estrada, cmds: ["tp 57 24", "hora 11", "zoom 2"], medir: true}
  - {nome: taverna_noite, area: taverna, cmds: ["hora 21", "zoom 3"], medir: true}
  - {nome: oficina, area: oficina, cmds: ["hora 12", "zoom 3"], medir: true}
  - {nome: curandeira, area: curandeira, cmds: ["hora 12", "zoom 3"], medir: true}
  - {nome: estrutura, area: estrutura, cmds: ["equipar lamparina", "zoom 3"]}
  # telas
  - {nome: mochila_720, area: vila, cmds: ["tp 30 33", "hora 10", "mochila"]}
  - {nome: mochila_1080, area: vila, tamanho: [1920, 1080], cmds: ["tp 30 33", "hora 10", "mochila"]}
  - {nome: comercio_720, area: estrada, cmds: ["tp 57 24", "hora 11", "comercio posto"], quadros: 150}
  - {nome: comercio_1080, area: estrada, tamanho: [1920, 1080], cmds: ["tp 57 24", "hora 11", "comercio posto"], quadros: 150}
  - {nome: conversa, area: oficina, cmds: ["falar avel"], quadros: 150}
  - {nome: caderno, area: vila, cmds: ["tp 30 33", "caderno"]}
  - {nome: caderno_texto_maior, area: vila, texto: 1.5, cmds: ["tp 30 33", "caderno"]}

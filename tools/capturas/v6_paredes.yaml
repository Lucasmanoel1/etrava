# Capturas do V6 — a casca dos cômodos: paredes de fundo, paredes da frente cortadas, cantos e
# piso com borda acabada (gradlew captures -Proteiro=v6_paredes; docs/visual/V6.md, tarefas 1, 2 e 5).
# Cada interior de dia e à noite, de longe (o cômodo inteiro) e de perto (o jogador encostado
# na parede da frente: ele nunca some atrás dela).
padrao: {semente: 5, tamanho: [1280, 720], quadros: 60}

cenas:
  - {nome: oficina_dia, area: oficina, cmds: ["tp 6 5", "hora 10", "zoom 1"]}
  - {nome: oficina_noite, area: oficina, cmds: ["tp 6 5", "hora 22.5", "zoom 1"]}
  - {nome: oficina_frente, area: oficina, cmds: ["tp 6 8.6", "hora 10", "zoom 2"]}
  - {nome: taverna_dia, area: taverna, cmds: ["tp 7 5.5", "hora 10", "zoom 1"]}
  - {nome: taverna_noite, area: taverna, cmds: ["tp 7 5.5", "hora 22.5", "zoom 1"]}
  - {nome: taverna_frente, area: taverna, cmds: ["tp 12.6 6", "hora 10", "zoom 2"]}
  - {nome: moinho_dia, area: moinho, cmds: ["tp 5 5", "hora 10", "zoom 1"]}
  - {nome: moinho_noite, area: moinho, cmds: ["tp 5 5", "hora 22.5", "zoom 1"]}
  - {nome: moinho_frente, area: moinho, cmds: ["tp 4 8.6", "hora 10", "zoom 2"]}
  - {nome: curandeira_dia, area: curandeira, cmds: ["tp 4.5 4", "hora 10", "zoom 1"]}
  - {nome: curandeira_noite, area: curandeira, cmds: ["tp 4.5 4", "hora 22.5", "zoom 1"]}
  - {nome: curandeira_frente, area: curandeira, cmds: ["tp 7.6 6.6", "hora 10", "zoom 2"]}

# Fatos: a unidade de conhecimento do jogo (PRD 8.2, RF-120).
#   layer:  V0 superfície · V1 suspeita (só como pista) · V2/V3 proibidos no Capítulo I
#   truth:  oculto do jogador — true | false | partial | unknown
#   spread: o quanto vira rumor entre NPCs — none | local | wide
#   versions: como o fato é contado; a primeira é a padrão. O texto é o que vai para o caderno,
#             depois de "Fulano disse:" — por isso é uma afirmação, nunca uma instrução.
# Conteúdo de exemplo do M3 (arco da árvore e notícias de fora); o conteúdo final é do M7.


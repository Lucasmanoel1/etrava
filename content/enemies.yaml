  money: 5
  lines:
    ataque: "A bolsa. Devagar."
    rende: "Chega! Chega. Fica com tudo."
    foge: "Não vale isso."
    vence: "Viu? Era só ter dado."
    poupado: "…Não vou esquecer."
    saqueado: "Leva. Leva e some."


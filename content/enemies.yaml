# Inimigos (RF-223, PRD 7.3). Três tipos no MVP: animal, humano e o que mora na estrutura enterrada.
# Tempos em segundos (de combate, em tempo real); distâncias em metros. Ver CONTENT.md.
#   health / damage / protection   vida, dano-base de um golpe, quanto tira de cada golpe recebido
#   skill                          "Luta" do inimigo (0–100): mexe nas chances dos dois lados
#   speed / reach                  velocidade correndo; alcance do golpe
#   attackTime / windup            intervalo entre golpes; quanto o golpe demora a sair depois de
#                                  anunciado (é a janela para esquivar)
#   aggro / leash                  a que distância percebe o jogador; quanto se afasta de onde
#                                  apareceu antes de desistir (correr para longe é fugir)
#   flee / surrender               fração da vida em que foge; chance de se render em vez disso (só humano)
#   lethal                         perder para ele é morrer (RF-341). Áreas também podem ser letais.
#   robs                           vencendo, leva dinheiro e coisas; também aceita a rendição do jogador
#   fearsLight                     hesita na luz de uma lamparina
#   loot / money                   o que leva consigo
#   lines                          falas: ataque, rende, foge, vence, poupado, saqueado
# O texto é provisório até a leitura de tom do diretor.

- id: lobo
  name: Lobo magro
  kind: animal
  sprite: personagem.lobo
  health: 28
  damage: 7
  protection: 0
  skill: 15
  speed: 4.6
  reach: 1.3
  attackTime: 1.4
  windup: 0.35
  aggro: 9
  leash: 22
  flee: 0.3
  loot:
    - {item: pele_lobo}

- id: saqueador
  name: Saqueador

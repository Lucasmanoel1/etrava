# Contêineres (RF-204): cestos, sacos, baús. Clique para abrir; pegar do que tem dono é roubo
# (ato `roubo` de deeds.yaml) — mas só pesa para quem estiver vendo (RF-089). Ninguém vendo,
# ninguém sabe. O dono repõe de tantos em tantos dias (restockDays: 0 = nunca).
#   at:    area/ponto do mapa
#   owner: NPC dono (omitido = de ninguém)

# O baú de Avel, na oficina (A2). Os papéis não se repõem: quem pega, fica com eles.
- id: bau_avel
  name: Baú de Avel
  at: oficina/bau
  owner: avel
  restockDays: 0
  items:
    - {item: papeis_avel, qty: 1}
    - {item: carta_iria, qty: 1}
    - {item: esboco_simbolos, qty: 1}
    - {item: pregos, qty: 2}

# As cinzas da lareira da oficina: depois que Avel queima a carta (A2), sobra um canto.
- id: cinzas_oficina
  name: Cinzas da lareira
  at: oficina/lareira
  restockDays: 0
  when: {arc: {id: a2_avel, stage: [carta, confessa, encontrado, partiu, averiguacao]}}
  items:
    - {item: canto_carta, qty: 1}

- id: sacos_moinho
  name: Sacos de farinha
  at: moinho/mo
  owner: moleiro
  restockDays: 2
  items:
    - {item: farinha, qty: 3}

- id: cesto_horta
  name: Cesto da horta

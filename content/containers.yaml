- id: mesa_registrador
  name: Papéis da comitiva
  at: vila/comitiva
  owner: registrador
  restockDays: 0
  when: {arc: {id: a2_avel, stage: [comitiva, carta]}}
  items:
    - {item: edital_caldris, qty: 1}

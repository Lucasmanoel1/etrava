- id: caixotes_posto
  name: Caixotes do Posto
  at: estrada/posto_carga
  owner: comerciante_posto
  restockDays: 3
  items:
    - {item: biscoito, qty: 2}
    - {item: corda, qty: 1}

# A estrutura enterrada (M6). De ninguém — ou de alguém que não reclama.
- id: nicho_estrutura

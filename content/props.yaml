# Props: objetos posicionáveis nos mapas. Dimensões em metros.
#   footprint: [largura (eixo x), profundidade (eixo y)] da base
#   blocks:    impede a passagem
#   sprite:    ID do asset; se omitido, vale prop.<id>
#   lights:    luzes acesas à noite; offset = [x, y, z] a partir do centro da base
# Construções são props grandes: do lado de fora são um sprite só; o interior é outra área (D-023).


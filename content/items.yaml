- id: livro_enterros
  name: Livro de enterros
  description: "O livro de Firmino. Capa de couro, páginas que cheiram a terra."
  category: documento
  tags: [cemiterio]
  weight: 0.8
  value: 0
  text: "Ano do granizo: enterrado o velho Tobiel, levado pelo caminho dos mortos, entre as terras de Rusk e de Tarso, como sempre se fez. (Rusk é o avô de Bento; Tarso, o de Gil. O caminho é a faixa da divisa.)"
  use:
    - {learn: {who: player, fact: divisa_era_caminho, certainty: read}}
    - {learn: {who: player, fact: firmino_conhece_mortos, certainty: read}}

  tags: [estranho, mir]
  weight: 0.05
  value: 0
  text: "Pessoal da casa de máquinas de Mir, o que se lembra: Taren (transporte), Ivo, os dois irmãos Sal, a mulher dos registros, A. (técnico) — este último riscado, e escrito de novo ao lado, mais forte. Embaixo, outra letra: 'saiu na noite, com crianças'."
  use:
    - {learn: {who: player, fact: lista_nomes_mir, certainty: read}}

- id: canto_carta

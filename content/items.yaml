# ---------- M7: documentos legíveis (RF-124). Usar = ler; o papel fica na mochila.
- id: papeis_avel
  name: Registro de passagem
  description: "Papel dobrado em quatro, amarelo nas dobras."
  category: documento
  tags: [avel]
  weight: 0.05
  value: 0
  text: "REGISTRO DE PASSAGEM — Posto de Vau-Seco. Portador: AVEL, técnico de máquinas, com uma criança de colo, parente. Destino: o sul. (O nome do portador está escrito por cima de outro, raspado com faca. A data é de vinte e quatro anos atrás.)"
  use:
    - {learn: {who: player, fact: papeis_nome_raspado, certainty: read}}
    - {setFlag: leu_papeis_avel}

- id: carta_iria
  name: Carta curta
  description: "Letra apertada, de quem escreve com pressa e pouca luz."
  category: documento
  tags: [avel]
  weight: 0.05
  value: 0
  text: "A., não volte por mim. Leve o que der e não diga meu nome a ninguém, nem à criança quando crescer. Se perguntarem, foi um acidente. — Iria"
  use:
    - {learn: {who: player, fact: carta_assinada_iria, certainty: read}}
    - {setFlag: leu_carta_iria}

- id: esboco_simbolos
  name: Desenho velho
  description: "Papel encerado, dobrado muitas vezes. Um desenho de engrenagem e umas marcas na margem."
  category: documento
  tags: [avel, estrutura]
  weight: 0.05
  value: 0
  text: "Um mecanismo redondo, de dentes finos, que não se parece com nada da oficina. Na margem, à mão de Avel: marcas curtas em grupos de nove, e uma palavra riscada até furar o papel."
  use:
    - {setFlag: leu_esboco}

- id: bilhete_avel
  name: Bilhete de Avel
  description: "Estava no bolso do seu avental, dobrado como ele dobra as notas de encomenda."
  category: documento
  tags: [avel]
  weight: 0.05
  value: 0
  text: "A oficina é sua. O torno puxa para a esquerda, não force. Não venha atrás. Não é por você que eu vou. — A."
  use:
    - {learn: {who: player, fact: avel_partiu, certainty: read}}

- id: edital_caldris
  name: Edital de Caldris
  description: "Papel bom, carimbo vermelho. Pregado na porta da taverna, e alguém arrancou."
  category: documento
  tags: [comitiva]
  weight: 0.05
  value: 0
  text: "A REPÚBLICA DE CALDRIS, pelo seu Escritório de Cadastro e Traçado, faz saber: as terras ao sul da Encruzilhada serão medidas e registradas. Toda terra sem título apresentado em trinta dias passa ao cadastro da República, para fins de utilidade pública. Assina: A. Dask, mestre-registrador."
  use:
    - {learn: {who: player, fact: edital_caldris, certainty: read}}
    - {learn: {who: player, fact: faixa_para_caldris, certainty: read}}

- id: tracado_agrimensora
  name: Folha de traçado
  description: "Uma folha da agrimensora, cheia de números, com uma linha reta a carvão."
  category: documento
  tags: [comitiva, ferrovia]
  weight: 0.05
  value: 0
  text: "Pedra-Mansa, folha 3. Linha de eixo: do marco da Encruzilhada ao vau do sul, reta. Observação: atravessa campo-santo (aprox. 40 sepulturas). Sem desvio previsto. Ao lado, em letra miúda: 'perguntar de novo pelo pessoal de Mir'."
  use:
    - {learn: {who: player, fact: tracado_ferrovia, certainty: read}}

- id: lista_oren
  name: Lista de nomes
  description: "Papel muito manuseado, com nomes em três letras diferentes."

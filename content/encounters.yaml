# Encontros (PRD 7.3). Sorteados quando o jogador chega à área e a cada hora em que fica nela —
# também dormindo ou esperando, e aí o ataque interrompe o descanso (RF-323).
#   at:       pontos do mapa (spots ou spawns) onde os inimigos surgem; um é sorteado
#   enemies:  quem aparece e quantos
#   when:     condição (vocabulário de CONTENT.md); ausente = sempre
#   chance:   chance a cada sorteio
#   cooldown: horas de jogo até poder acontecer de novo
#   once:     no máximo uma vez por partida
# O efeito {encounter: id} força um encontro (RF-102, "iniciar combate"), se o jogador estiver na área.
# Até a estrada ganhar mapa (M7), a área de teste faz as vezes dela.

- id: lobos_estrada
  area: area_teste
  at: [bosque_norte, bosque_oeste]
  enemies:
    - {enemy: lobo, qty: 2}
  when: {time: {hourFrom: 20, hourTo: 5}}
  chance: 0.3
  cooldown: 20

- id: saqueadores_estrada
  area: area_teste
  at: [curva_estrada, bosque_oeste]
  enemies:
    - {enemy: saqueador, qty: 2}
  when: {time: {hourFrom: 16, hourTo: 23}}
  chance: 0.12
  cooldown: 48

- id: vulto_camara
  area: estrutura
  at: [camara_fundo]
  enemies:
    - {enemy: vulto, qty: 1}
  chance: 1.0
  cooldown: 72

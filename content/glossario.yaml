# Glossário único de nomes próprios do jogo (PRD 20.3). Todo nome novo é provisório
# até o diretor aprovar. Nomes vindos da lore ficam marcados com `fonte: lore`.

lugares:
  - {nome: Etrava, tipo: mundo, fonte: lore}
  - {nome: Pedra-Mansa, tipo: vilarejo, fonte: lore}
  - {nome: Posto da Encruzilhada, tipo: entreposto na estrada, fonte: PRD}

pessoas:
  - {nome: Nalia, tipo: filha do moleiro, fonte: lore}
  - {nome: Berta, tipo: a mulher do incêndio (só em rumores; o nome não é dito no jogo), fonte: lore}
# Os demais NPCs (ferreiro, taberneira, moleiro, aldeã, viajante, curandeira) são provisórios e
# ainda não têm nome próprio: aparecem só pelo ofício.

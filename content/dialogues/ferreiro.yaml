# Doran, o ferreiro. Amigo de Avel há vinte anos. No A1 propõe cortar a árvore; sem Avel (A2),
# é quem passa serviço ao aprendiz.
id: ferreiro
start:
  - {when: {arc: {id: a1_nalia, stage: impasse}}, goto: machado}
  - {when: {arc: {id: a2_avel, stage: [partiu, averiguacao]}}, goto: sem_avel}
  - {goto: forja}
nodes:
  forja:
    text: "Ferradura é amanhã. Prego é hoje, se tiver o ferro."
    choices:
      - text: "Precisa de mão na forja?"
        when: {job: forja}
        goto: servico
      - {text: "Você conhece o Avel há quanto tempo?", goto: avel}
      - text: "O Avel anda estranho."
        when: {arc: {id: a2_avel, stage: [estranho_chega, comitiva, carta]}}
        goto: estranho
      - {text: "Só passando."}
  servico:
    text: "Tem prego para bater e dobradiça para endireitar. Quatro horas, nove moedas. E não me queima a mão."
    choices:
      - text: "Começo agora."
        effects: [{startJob: forja}]
      - {text: "Mais tarde."}
  avel:
    text: "Desde que ele desceu de uma carroça com você embrulhado num casaco. Nunca perguntei de onde. Não vou começar agora."
    effects: [{learn: {who: player, fact: doran_avel_amigos, certainty: claim}}, {learn: {who: player, fact: avel_chegou_com_crianca, certainty: claim}}]
  estranho:
    text: "Ele anda é cansado. Homem velho cansa de coisa velha. Não fica cutucando."
  sem_avel:
    text: "A oficina é sua agora. Se precisar de encomenda, eu passo. Se precisar de outra coisa, não sei dar."
    choices:
      - text: "Precisa de mão na forja?"
        when: {job: forja}
        goto: servico
      - {text: "Ele disse alguma coisa a você?", goto: disse}
      - {text: "Obrigado, Doran."}
  disse:
    text: "Disse que o torno puxa para a esquerda. Vinte anos e é isso que ele me deixa."
  machado:
    text: "Árvore que come gente, a gente corta. Não precisa de curandeira para isso."
    effects: [{learn: {who: player, fact: ferreiro_quer_cortar, certainty: claim}}]
    choices:
      - text: "Eu ajudo."
        relevant: true
        channels: [ambiente, npc, dialogue]
        effects:
          - {setFlag: jogador_apoiou_corte}
          - {opinion: {npc: npc, add: 8}}
          - {opinion: {npc: nalia, add: -30}}
          - {remember: {npc: nalia, type: traicao, subject: player}}
        goto: ajuda
      - {text: "A menina não quer.", goto: nao_quer}
      - text: "Tem outro jeito. Repartir o peso entre três."
        when: {all: [{knows: {who: player, fact: custo_pode_ser_dividido}}, {not: {flag: vol_ferreiro}}]}
        goto: reparte
  ajuda:
    text: "Amanhã cedo. Antes de a menina acordar. Se é que ela dorme."
  nao_quer:
    text: "Menina também não quer remédio."
  reparte:
    text: "Eu carrego ferro o dia inteiro. De noite eu quero é dormir."
    choices:
      - text: "Um terço de noite mal dormida. Pela filha do moleiro."
        effects: [{setFlag: vol_ferreiro}, {addVar: {name: voluntarios, value: 1}}]
        goto: terco
      - {text: "Então não."}
  terco:
    text: "Um terço. Nem um dedo a mais."

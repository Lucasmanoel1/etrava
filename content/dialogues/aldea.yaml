# Segunda fonte para o rumor da árvore — na versão exagerada.
id: aldea
start:
  - {goto: oi}
nodes:
  oi:
    text: "Você é o da oficina. Está sempre com graxa na cara."
    choices:
      - {text: "É para combinar com a oficina.", goto: combina}
      - {text: "Alguma novidade?", goto: novidade}
      - {text: "Bom dia para você também."}
  combina:
    text: "Combina."
  novidade:
    text: "A árvore do moinho voltou. A menina encostou nela e pronto."
    effects: [{learn: {who: player, fact: arvore_voltou, version: exagero, certainty: claim}}]
    choices:
      - {text: "Encostou e pronto?", goto: nao_vi}
      - {text: "Hm."}
  nao_vi:
    text: "Eu não vi. Mas quem me contou também não viu, então deve ser verdade."

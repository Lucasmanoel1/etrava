# A estrutura enterrada (PRD 6, gancho 03): abre-se no campo de Bento durante um trabalho (A3).
- id: estrutura
  name: A estrutura enterrada
  place: O buraco no campo
  map: estrutura.tmj
  mapPos: [0.45, 0.66]
  dark: true
  lethal: true
  music: musica.ruina
  ambience: amb.ruina
  exits:
    - {spot: escada, to: vila, spawn: buraco}

# Áreas jogáveis da região do MVP (PRD 6.3). Cada uma aponta para um mapa do Tiled (.tmj) nesta pasta,
# gerado por `gradlew generateRegion` (vila, estrada, interiores) e `gradlew generateEstrutura`.
#   name:     como a área aparece no caderno e no mapa
#   place:    lugar nomeado a que pertence; entrar a primeira vez anota no caderno (RF-007)
#   mapPos:   onde fica no mapa ilustrado (0 a 1 em x e y)
#   interior: dentro de uma construção — luz própria, sem dia e noite lá fora (D-068)
#   dark:     escura de dia e de noite; só se vê no raio de luz do personagem (RF-008)
#   lethal:   perder aqui é morrer de verdade (RF-341); o padrão é a derrota não letal
#   exits:    chegar ao ponto `spot` leva à área `to`, entrando pelo ponto de chegada `spawn`;
#             com `when`, só leva enquanto a condição valer. NPCs passam pelas mesmas portas.
#   wakeAt:   onde se acorda depois de uma derrota não letal aqui ("area/ponto")
#   finder:   quem acha o personagem desacordado (fica sabendo e lembra)
#   music / ambience: faixa de música e som ambiente (IDs de asset; o cliente acrescenta .dia/.noite)

- id: vila
  name: Pedra-Mansa
  place: Pedra-Mansa
  map: vila.tmj
  mapPos: [0.38, 0.52]
  music: musica.vila
  ambience: amb.vila
  exits:
    - {spot: saida_estrada, to: estrada, spawn: vila}
    - {spot: oficina_porta, to: oficina, spawn: porta}
    - {spot: taverna_porta, to: taverna, spawn: porta}
    - {spot: moinho_porta, to: moinho, spawn: porta}
    - {spot: curandeira_porta, to: curandeira, spawn: porta}
    # o campo de Bento cede durante o trabalho (A3); depois de tapado, não se desce mais
    - {spot: buraco, to: estrutura, spawn: jogador, when: {prop: {key: buraco_campo, state: aberto}}}
  wakeAt: vila/praca_banco
  finder: curandeira


# Ciclo de luz do dia (RF-027). O jogo interpola entre as linhas pela hora.
#   ambient:    cor que multiplica a cena inteira (a "luz do céu")
#   night:      0 = dia, 1 = noite — o quanto lamparinas e janelas aparecem acesas
#   saturation: 1 = cores normais; menor = mais apagado
#   contrast:   1 = normal
#   vignette:   escurecimento das bordas da tela
#   actor:      luz de presença (D-090): os personagens nunca recebem menos que ambient × actor
#               (teto 0,88). 1 = sem reforço. À noite o reforço é azulado como o céu: lê-se a
#               pessoa sem a noite deixar de ser noite. Medido pelo VT-03 (gradlew vt03).


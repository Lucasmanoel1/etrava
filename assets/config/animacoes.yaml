# Animação pelo que o NPC está fazendo (SPEC-visual §6.3, V2). A simulação diz a atividade da
# agenda (o `do:` de content/npcs/*.yaml); aqui ela vira uma animação da folha. Andando, vale
# andar/correr; sem regra, ou se a folha não tiver a animação, `parado`.
# Uma lista alterna a cada `alternar` segundos, com fase própria de cada NPC.
# `sentado` entra com `sentar` uma vez antes, se a folha tiver.
alternar: 7

# Onde cada animação pode acontecer (V2): perto (até `alcance` m) de um destes props, ou sobre um
# destes terrenos. Sem o lugar, o NPC fica em `parado`: ninguém trabalha no meio da praça, senta no
# ar ou dorme no chão. Perto, ele se vira para o objeto; no banco e na cama, é desenhado nele.
# Animação sem entrada aqui (parado, conversar) vale em qualquer lugar.
lugares:
  trabalhar_martelo: {props: [bigorna, forja], alcance: 2.0}
  trabalhar_bancada: {props: [bancada, balcao, banca, mesa, mesa_longa], alcance: 1.6}
  trabalhar_chao:
    props: [feno, sacos, caixote, fibra, ervas, mo, buraco_campo, espantalho, arvore_fruto, arvore_fruto_b,
            arvore_velha, arvore_morta, marco, estaca, poco, carroca]
    terrenos: [plantio]
    alcance: 1.6
  sentado: {props: [banco], alcance: 1.6}
  dormir: {props: [cama], alcance: 1.6}

atividades:
  # trabalho: o tipo sai do ofício (ficha em tools/blender/personagens/<id>.yaml)
  trabalhar:
    padrao: trabalhar_bancada
    por_npc: {ferreiro: trabalhar_martelo, moleiro: trabalhar_chao, nalia: trabalhar_chao, aldea: trabalhar_chao}
  lavrar: trabalhar_chao
  colher: trabalhar_chao
  cuidar: trabalhar_chao
  ajudar: trabalhar_chao
  carregar: trabalhar_chao
  medir: trabalhar_chao
  consertar: trabalhar_bancada
  preparar: trabalhar_bancada
  servir: trabalhar_bancada
  lavar: trabalhar_bancada
  escrever: trabalhar_bancada
  registrar: trabalhar_bancada
  estudar: trabalhar_bancada
  contar: trabalhar_bancada
  # sentado
  comer: sentado
  jantar: sentado
  beber: sentado
  jogar: sentado
  sentar: sentado
  descansar: sentado
  # deitado
  dormir: {padrao: dormir, por_npc: {estranho: sentado}}   # o estranho dorme sentado à mesa da taverna
  de_cama: dormir
  # fala
  conversar: conversar
  perguntar: conversar
  atender: conversar
  vender: [conversar, parado]
  festejar: [conversar, parado]
